<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Интерактив: просмотр картинки</title>
  <style>
    /* Родительский контейнер — ширина задаётся здесь */
    .parent-wrapper {
      max-width: 800px;
      margin: 20px auto;
      padding: 0;
    }

    /* Картинка по ширине родителя */
    .img-preview {
      width: 100%;
      height: auto;
      display: block;
      cursor: pointer;
      border-radius: 4px;
    }

    /* Затемнение страницы — 20% как просили */
    .lightbox-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.2); /* 20% затемнение */
      z-index: 9999;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s ease, visibility 0.3s;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .lightbox-overlay.active {
      opacity: 1;
      visibility: visible;
    }

    /* Блок с большой картинкой — без рамок */
    .lightbox-content {
      position: relative;
      max-width: 95vw;
      max-height: 95vh;
      z-index: 10000;
    }

    .lightbox-img {
      display: block;
      max-width: 100%;
      max-height: 90vh;
      object-fit: contain;
    }

    /* Крестик закрытия */
    .close-btn {
      position: absolute;
      top: 15px;
      right: 15px;
      color: #fff;
      font-size: 32px;
      line-height: 1;
      cursor: pointer;
      background: rgba(0,0,0,0.6);
      padding: 6px 10px;
      border-radius: 6px;
      z-index: 10001;
    }
    .close-btn:hover {
      background: rgba(255,255,255,0.2);
    }
  </style>
</head>
<body>

  <!-- Родитель, в котором стоит картинка -->
  <div class="parent-wrapper">
    <img
      src="https://e.profkiosk.ru/service_tbn2/h_ldroiml0ga.png"
      alt="Нажмите для просмотра в полный размер"
      class="img-preview"
      id="previewImg"
    />
  </div>

  <!-- Модальное окно (лайтбокс) -->
  <div class="lightbox-overlay" id="lightbox">
    <div class="lightbox-content">
