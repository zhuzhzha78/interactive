<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Интерактив с картинкой</title>
  <style>
    /* Контейнер родителя — можно менять ширину */
    .image-container {
      max-width: 800px;
      margin: 0 auto;
    }

    /* Картинка по ширине родителя */
    .preview-img {
      width: 100%;
      height: auto;
      cursor: pointer;
      display: block;
      transition: opacity 0.2s;
    }
    .preview-img:hover {
      opacity: 0.9;
    }

    /* Затемнение фона */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: rgba(0, 0, 0, 0.8); /* 80% затемнение */
      z-index: 9998;
      opacity: 0;
      visibility: hidden;
      backdrop-filter: blur(2px);
      transition: opacity 0.3s, visibility 0.3s;
      justify-content: center;
      align-items: center;
    }
    .modal-overlay.active {
      opacity: 1;
      visibility: visible;
    }

    /* Окно с картинкой — без рамок */
    .modal-content {
      position: relative;
      max-width: 90vw;
      max-height: 90vh;
      z-index: 9999;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .modal-img {
      max-width: 100%;
      max-height: 85vh; /* чтобы не вылезало за экран по высоте */
      display: block;
    }
