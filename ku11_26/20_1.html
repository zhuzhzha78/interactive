<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Интерактив с картинкой</title>
  <style>
    /* Контейнер родителя — можно менять ширину */
    .image-container {
      max-width: 800px;
      margin: 0 auto;
    }

    /* Картинка по ширине родителя */
    .preview-img {
      width: 100%;
      height: auto;
      cursor: pointer;
      display: block;
      transition: opacity 0.2s;
    }
    .preview-img:hover {
      opacity: 0.9;
    }

    /* Затемнение фона */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: rgba(0, 0, 0, 0.8); /* 80% затемнение */
      z-index: 9998;
      opacity: 0;
      visibility: hidden;
      backdrop-filter: blur(2px);
      transition: opacity 0.3s, visibility 0.3s;
      justify-content: center;
      align-items: center;
    }
    .modal-overlay.active {
      opacity: 1;
      visibility: visible;
    }

    /* Окно с картинкой — без рамок */
    .modal-content {
      position: relative;
      max-width: 90vw;
      max-height: 90vh;
      z-index: 9999;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .modal-img {
      max-width: 100%;
      max-height: 85vh; /* чтобы не вылезало за экран по высоте */
      display: block;
    }

    /* Крестик закрытия */
    .close-btn {
      position: absolute;
      top: 15px;
      right: 15px;
      color: white;
      font-size: 28px;
      line-height: 1;
      cursor: pointer;
      padding: 5px 8px;
      border-radius: 4px;
      background: rgba(0,0,0,0.5);
      z-index: 10000;
    }
    .close-btn:hover {
      background: rgba(255,255,255,0.2);
    }
  </style>
</head>
<body>

  <!-- Родительский контейнер (можно вставить в любое место страницы) -->
  <div class="image-container">
    <img
      src="https://e.profkiosk.ru/service_tbn2/h_ldroiml0ga.png"
      alt="Картинка для просмотра"
      class="preview-img"
      id="previewImg"
    />
  </div>

  <!-- Модальное окно -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-content">
      <span class="close-btn" id="closeBtn">&times;</span>
      <img src="" alt="Полноразмерная картинка" class="modal-img" id="modalImg" />
    </div>
  </div>

  <script>
    const previewImg = document.getElementById('previewImg');
    const modalOverlay = document.getElementById('modalOverlay');
    const modalImg = document.getElementById('modalImg');
    const closeBtn = document.getElementById('closeBtn');

    // Открыть модалку
    previewImg.addEventListener('click', () => {
      modalImg.src = previewImg.src; // копируем ссылку на полноразмер
      modalOverlay.classList.add('active');
    });

    // Закрыть по крестику
    closeBtn.addEventListener('click', () => {
      modalOverlay.classList.remove('active');
    });

    // Закрыть по клику на картинку (внутри модалки)
    modalImg.addEventListener('click', (e) => {
      e.stopPropagation(); // чтобы клик по картинке не считался кликом по оверлею
    });

    // Закрыть по клику вне картинки (на затемнённом фоне)
    modalOverlay.addEventListener('click', (e) => {
      if (e.target === modalOverlay) {
        modalOverlay.classList.remove('active');
      }
    });
  </script>
 <script src='https://cdnjs.cloudflare.com/ajax/libs/jquery/2.1.3/jquery.min.js'></script>
	<script src='https://zhuzhzha78.github.io/interactive/shablon/iframeResizer.contentWindow.min.js' type="text/javascript"></script>
</body>
</html>
