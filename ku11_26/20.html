<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Итоги тест-драйва ИИ-помощников для&nbsp;юриста</title>
  <style>
    /* Контейнер родителя — можно задать любую ширину */
    .image-container {
      width: 100%;
     /*  max-width: 800px; опционально: ограничим максимальную ширину */
      margin: 0 auto;
    }

    /* Картинка по ширине родителя */
    .interactive-img {
      width: 100%;
      height: auto;
      cursor: pointer;
      display: block;
      transition: opacity 0.2s;
    }
    .interactive-img:hover {
      opacity: 0.9;
    }

    /* Затемнение фона */
    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.8);
      z-index: 9998;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s, visibility 0.3s;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .overlay.active {
      opacity: 1;
      visibility: visible;
    }

    /* Всплывающее окно (картинка в полном размере) */
    .popup-image {
      max-width: 90vw;
      max-height: 90vh;
      object-fit: contain;
      border: none; /* без рамок */
      box-shadow: 0 0 20px rgba(0,0,0,0.5);
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- Родительский контейнер -->
  <div class="image-container">
    <img
      src="https://e.profkiosk.ru/service_tbn2/h_ldroiml0ga.png"
      alt="Интерактивная картинка"
      class="interactive-img"
      id="mainImg"
    />
  </div>

  <!-- Всплывающее затемнение и картинка -->
  <div class="overlay" id="overlay">
    <img
      src=""
      alt="Полноразмерная картинка"
      class="popup-image"
      id="popupImg"
    />
  </div>

  <script>
    const mainImg = document.getElementById('mainImg');
    const overlay = document.getElementById('overlay');
    const popupImg = document.getElementById('popupImg');

    // Открытие: копируем src в popup, показываем overlay
    mainImg.addEventListener('click', () => {
      popupImg.src = mainImg.src;
      overlay.classList.add('active');
    });

    // Закрытие по клику на картинку (или на фон)
    overlay.addEventListener('click', (e) => {
      if (e.target === overlay || e.target === popupImg) {
        overlay.classList.remove('active');
      }
    });
  </script>
 <script src='https://cdnjs.cloudflare.com/ajax/libs/jquery/2.1.3/jquery.min.js'></script>
	<script src='https://zhuzhzha78.github.io/interactive/shablon/iframeResizer.contentWindow.min.js' type="text/javascript"></script>
</body>
</html>
