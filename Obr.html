
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html, body {
  font-family: 'bureauserif', serif;
  background: transparent;
  box-shadow: none;
}

.interactive {
  position: relative;
  display: flex;
  align-items: flex-start;
  width: 100%;
  background: transparent;
  box-shadow: none;
}

.thumbnail {
  width: 100pt;
  cursor: pointer;
  flex-shrink: 0;
  display: block;
}

.content {
  display: flex;
  flex-direction: column;
  padding-left: 10pt;
  min-width: 0;
}

.text1 {
  font-size: 14pt;
  color: #000;
  line-height: 1.2;
}

.text2 {
  font-size: 18pt;
  font-weight: bold;
  color: #c94342;
  margin-top: 2pt;
  line-height: 1.2;
}

.divider {
  height: 2pt;
  background-color: #c94342;
  margin-top: 4pt;
  width: 100%;
}

.bottom-row {
  display: flex;
  align-items: center;
  margin-top: 8pt;
}

.bottom-img {
  width: 50pt;
  margin-right: 10pt;
  cursor: pointer;
  display: block;
  flex-shrink: 0;
}

.bottom-text {
  font-size: 12pt;
  color: #000;
  line-height: 1.2;
}

.overlay {
  display: none;
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  z-index: 9999;
  cursor: pointer;
}

.overlay img {
  width: 100%;
  display: block;
}

.overlay.active {
  display: block;
}
</style>
</head>
<body>

<div class="interactive" id="interactive">
  <img src="https://e.profkiosk.ru/service_tbn2/9jbeo0gg0uqb.png" class="thumbnail" id="thumbnail" alt="Образец">
  <div class="content">
    <div class="text1">Памятка</div>
    <div class="text2">Как юристу защитить себя от личных рисков в банкротстве</div>
    <div class="divider"></div>
    <div class="bottom-row">
      <img src="https://e.profkiosk.ru/service_tbn2/gm29so.png" class="bottom-img" id="bottomImg" alt="Развернуть">
      <div class="bottom-text">Нажмите на картинку, чтобы развернуть образец</div>
    </div>
  </div>
  <div class="overlay" id="overlay">
    <img src="https://e.profkiosk.ru/service_tbn2/9jbeo0gg0uqb.png" id="fullImage" alt="Образец">
  </div>
</div>

<script>
(function() {
  var thumbnail = document.getElementById('thumbnail');
  var bottomImg = document.getElementById('bottomImg');
  var overlay = document.getElementById('overlay');
  var fullImage = document.getElementById('fullImage');
  var interactive = document.getElementById('interactive');

  function expand() {
    overlay.classList.add('active');
    adjustHeight();
  }

  function collapse() {
    overlay.classList.remove('active');
    interactive.style.minHeight = '';
  }

  function adjustHeight() {
    var imgHeight = fullImage.offsetHeight;
    if (imgHeight > 0) {
      interactive.style.minHeight = imgHeight + 'px';
    }
  }

  thumbnail.addEventListener('click', expand);
  bottomImg.addEventListener('click', expand);
  overlay.addEventListener('click', collapse);

  fullImage.addEventListener('load', function() {
    if (overlay.classList.contains('active')) {
      adjustHeight();
    }
  });

  window.addEventListener('resize', function() {
    if (overlay.classList.contains('active')) {
      adjustHeight();
    }
  });
})();
</script>

</body>
</html>
