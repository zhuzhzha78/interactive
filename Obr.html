<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Интерактив: Образец</title>
<style>
  @font-face {
    font-family: 'bureauserif';
    src: local('BureauSerif'), local('bureauserif');
  }

  * {
    box-sizing: border-box;
  }

  html, body {
    width: 100%;
    height: 100%;
    background: transparent;
    box-shadow: none;
  }

  body {
    margin: 0;
    font-family: 'bureauserif', serif;
  }

  .interactive {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: flex-start;
    gap: 10pt;
    background: transparent;
    box-shadow: none;
  }

  .preview-img {
    width: 100pt;
    height: auto;
    cursor: pointer;
    flex-shrink: 0;
  }

  .info {
    display: flex;
    flex-direction: column;
    flex: 1;
    min-width: 0;
  }

  .text1 {
    font-size: 14pt;
    color: #000;
    margin: 0 0 4pt 0;
  }

  .text2 {
    font-size: 18pt;
    font-weight: bold;
    color: #c94342;
    margin: 0 0 4pt 0;
  }

  .line {
    height: 2pt;
    background-color: #c94342;
    width: 100%;
    margin-bottom: 8pt;
  }

  .bottom-row {
    display: flex;
    align-items: center;
    gap: 0;
  }

  .bottom-img {
    width: 50pt;
    height: auto;
    margin-right: 10pt;
    cursor: pointer;
    flex-shrink: 0;
  }

  .bottom-text {
    font-size: 12pt;
    color: #000;
    margin: 0;
  }

  .expanded-img {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: auto;
    z-index: 99999;
    cursor: pointer;
    display: none;
  }

  .expanded-img.show {
    display: block;
  }
</style>
</head>
<body>

<div class="interactive">
  <img class="preview-img"
       src="https://e.profkiosk.ru/service_tbn2/9jbeo0gg0uqb.png"
       alt="Образец"
       onclick="expandImage()">

  <div class="info">
    <p class="text1">Образец</p>
    <p class="text2">Как юристу защитить себя от личных рисков в банкротстве</p>
    <div class="line"></div>
    <div class="bottom-row">
      <img class="bottom-img"
           src="https://e.profkiosk.ru/service_tbn2/gm29so.png"
           alt="Иконка"
           onclick="expandImage()">
      <p class="bottom-text">Нажмите на картинку, чтобы развернуть образец</p>
    </div>
  </div>
</div>

<img class="expanded-img"
     id="bigImage"
     src="https://e.profkiosk.ru/service_tbn2/9jbeo0gg0uqb.png"
     alt="Образец развёрнутый"
     onclick="collapseImage()">

<script>
  function expandImage() {
    document.getElementById('bigImage').classList.add('show');
  }

  function collapseImage() {
    document.getElementById('bigImage').classList.remove('show');
  }
</script>

</body>
</html>
