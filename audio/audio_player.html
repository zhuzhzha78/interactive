<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Audio Player</title>
<style>
  @font-face {
    font-family: 'BureauSerif';
    src: local('BureauSerif'), local('Bureau Serif'), local('bureauserif');
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  .audio-player {
    width: 100%;
    height: 30pt;
    background: #a778b6;
    font-family: 'BureauSerif', 'Georgia', serif;
    font-size: 14pt;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    user-select: none;
  }

  /* ===== Верхняя половина — бегущая строка ===== */
  .marquee-row {
    height: 50%;
    background: rgba(167, 120, 182, 0.5); /* 50% цвета */
    overflow: hidden;
    display: flex;
    align-items: center;
    position: relative;
  }

  .marquee-track {
    display: inline-flex;
    white-space: nowrap;
    animation: marquee 12s linear infinite;
    padding-left: 100%;
    color: #fff;
    line-height: 1;
  }

  .marquee-track span {
    padding-right: 3em;
  }

  @keyframes marquee {
    0%   { transform: translateX(0); }
    100% { transform: translateX(-100%); }
  }

  /* ===== Нижняя половина — контролы ===== */
  .controls-row {
    height: 50%;
    display: flex;
    align-items: center;
    padding: 0 6pt;
    gap: 6pt;
  }

  /* Кнопка play/pause */
  .play-btn {
    flex: 0 0 auto;
    width: 18pt;
    height: 18pt;
    border: none;
    background: transparent;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
  }

  .play-btn svg {
    width: 100%;
    height: 100%;
    fill: #fff;
  }

  /* Таймлайн */
  .timeline-wrap {
    flex: 1 1 auto;
    position: relative;
    height: 3pt;
    cursor: pointer;
  }

  .timeline-track {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: #fff;            /* таймлайн белый */
    border-radius: 1.5pt;
  }

  .timeline-fill {
    position: absolute;
    top: 0;
    left: 0;
    height: 100%;
    width: 0;
    background: rgba(167, 120, 182, 0.75); /* бегунок 75% цвета */
    border-radius: 1.5pt;
    pointer-events: none;
  }

  .timeline-knob {
    position: absolute;
    top: 50%;
    width: 5pt;
    height: 5pt;
    background: rgba(167, 120, 182, 0.75);
    border-radius: 50%;
    transform: translate(-50%, -50%);
    pointer-events: none;
  }

  /* Таймеры */
  .timers {
    flex: 0 0 auto;
    color: #fff;
    font-size: 10pt;
    line-height: 1;
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }
</style>
</head>
<body>

<div class="audio-player">
  <!-- Верхняя половина: бегущая строка -->
  <div class="marquee-row">
    <div class="marquee-track">
      <span>бла-бла-бла</span>
      <span>бла-бла-бла</span>
      <span>бла-бла-бла</span>
    </div>
  </div>

  <!-- Нижняя половина: контролы -->
  <div class="controls-row">
    <button class="play-btn" id="playBtn" aria-label="Play / Pause">
      <!-- SVG play -->
      <svg id="iconPlay" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      <!-- SVG pause (скрыт по умолчанию) -->
      <svg id="iconPause" viewBox="0 0 24 24" style="display:none"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
    </button>

    <div class="timeline-wrap" id="timeline">
      <div class="timeline-track"></div>
      <div class="timeline-fill" id="timelineFill"></div>
      <div class="timeline-knob" id="timelineKnob" style="left:0"></div>
    </div>

    <div class="timers">
      <span id="currentTime">0:00</span> / <span id="totalTime">0:00</span>
    </div>
  </div>
</div>

<audio id="audio" preload="metadata" src="https://zhuzhzha78.github.io/interactive/audio/mp3/UK1.mp3"></audio>

<script>
(function () {
  const audio       = document.getElementById('audio');
  const playBtn     = document.getElementById('playBtn');
  const iconPlay    = document.getElementById('iconPlay');
  const iconPause   = document.getElementById('iconPause');
  const timeline    = document.getElementById('timeline');
  const fill        = document.getElementById('timelineFill');
  const knob        = document.getElementById('timelineKnob');
  const currentTime = document.getElementById('currentTime');
  const totalTime   = document.getElementById('totalTime');

  function fmt(sec) {
    if (!isFinite(sec)) return '0:00';
    const m = Math.floor(sec / 60);
    const s = Math.floor(sec % 60);
    return m + ':' + (s < 10 ? '0' + s : s);
  }

  // Клик по кнопке
  playBtn.addEventListener('click', function () {
    if (audio.paused) audio.play();
    else audio.pause();
  });

  // Переключение иконок
  audio.addEventListener('play', function () {
    iconPlay.style.display  = 'none';
    iconPause.style.display = 'block';
  });
  audio.addEventListener('pause', function () {
    iconPlay.style.display  = 'block';
    iconPause.style.display = 'none';
  });

  // Длительность загружена
  audio.addEventListener('loadedmetadata', function () {
    totalTime.textContent = fmt(audio.duration);
  });

  // Время обновляется
  audio.addEventListener('timeupdate', function () {
    const p = audio.duration ? (audio.currentTime / audio.duration) * 100 : 0;
    fill.style.width = p + '%';
    knob.style.left  = p + '%';
    currentTime.textContent = fmt(audio.currentTime);
  });

  // Перемотка кликом
  timeline.addEventListener('click', function (e) {
    const rect = timeline.getBoundingClientRect();
    const ratio = (e.clientX - rect.left) / rect.width;
    if (audio.duration) audio.currentTime = ratio * audio.duration;
  });

  // Перемотка перетаскиванием
  let dragging = false;
  function updateFromPointer(e) {
    const rect = timeline.getBoundingClientRect();
    let ratio = (e.clientX - rect.left) / rect.width;
    ratio = Math.max(0, Math.min(1, ratio));
    if (audio.duration) audio.currentTime = ratio * audio.duration;
  }
  timeline.addEventListener('mousedown', function (e) {
    dragging = true;
    updateFromPointer(e);
  });
  document.addEventListener('mousemove', function (e) {
    if (dragging) updateFromPointer(e);
  });
  document.addEventListener('mouseup', function () {
    dragging = false;
  });
})();
</script>

</body>
</html>
