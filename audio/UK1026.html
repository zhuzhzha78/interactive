
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Аудиоплеер</title>
<style>
@font-face {
  font-family: 'Bureauserif';
  src: url('https://db.onlinewebfonts.com/t/4ce3340699bbce8a0f4ae7c4269540c8.eot');
  src: url('https://db.onlinewebfonts.com/t/4ce3340699bbce8a0f4ae7c4269540c8.eot?#iefix') format('embedded-opentype'),
       url('https://db.onlinewebfonts.com/t/4ce3340699bbce8a0f4ae7c4269540c8.woff2') format('woff2'),
       url('https://db.onlinewebfonts.com/t/4ce3340699bbce8a0f4ae7c4269540c8.woff') format('woff'),
       url('https://db.onlinewebfonts.com/t/4ce3340699bbce8a0f4ae7c4269540c8.ttf') format('truetype');
  font-weight: normal;
  font-style: normal;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html, body { height: 100%; }

body {
  margin: 0;
  display: flex;
  align-items: stretch;
}

.audio-player {
  --h: 60px;
  height: 30px;
  min-height: 40px;
  width: 100%;
  background-color: #a778b6;
  display: flex;
  align-items: stretch;
  font-family: 'Bureauserif', 'PT Serif', Georgia, serif;
  font-size: 14pt;
  position: relative;
  overflow: visible;
  user-select: none;
}

/* --- Кнопки --- */
.btn {
  height: 100%;
  width: var(--h);
  background: transparent;
  border: none;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  padding: 0;
  position: relative;
}

.btn-play {
  border-right: 1pt solid gray;
}

.btn-volume {
  border-left: 1pt solid gray;
}

.btn svg {
  width: calc(var(--h) * 0.45);
  height: calc(var(--h) * 0.45);
  fill: white;
  pointer-events: none;
}

/* --- Центральная зона --- */
.center {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  min-width: 0;
}

/* --- Верхняя половина --- */
.top-half {
  height: 50%;
  background-color: #bd9ac8;
  display: flex;
  align-items: center;
  overflow: hidden;
  position: relative;
  padding: 0 calc(var(--h) * 0.06);
}

.title-wrap {
  overflow: hidden;
  width: 100%;
  position: relative;
}

.title-text {
  color: black;
  font-size: 14pt;
  white-space: nowrap;
  display: inline-block;
  line-height: 1.2;
}

.title-text.marquee {
  animation: scrollLeft 14s linear infinite;
}

@keyframes scrollLeft {
  0%   { transform: translateX(0); }
  100% { transform: translateX(-50%); }
}

/* --- Нижняя половина --- */
.bottom-half {
  height: 50%;
  display: flex;
  align-items: center;
  padding: 0 calc(var(--h) * 0.06);
  gap: calc(var(--h) * 0.04);
  overflow: hidden;
}

.timer {
  color: white;
  font-size: calc(var(--h) * 0.22);
  white-space: nowrap;
  flex-shrink: 0;
  line-height: 1;
}

.timeline {
  flex: 1;
  height: calc(var(--h) * 0.28);
  background: white;
  border-radius: 999px;
  position: relative;
  cursor: pointer;
  min-width: 0;
}

.timeline-played {
  height: 100%;
  background-color: #7d5a89;
  border-radius: 999px;
  width: 0%;
  pointer-events: none;
}

.timeline-thumb {
  position: absolute;
  top: 50%;
  transform: translate(-50%, -50%);
  width: calc(var(--h) * 0.35);
  height: calc(var(--h) * 0.35);
  border-radius: 50%;
  background: white;
  pointer-events: none;
  left: 0%;
  box-shadow: 0 0 2px rgba(0,0,0,0.3);
}

/* --- Всплывающий регулятор громкости --- */
.volume-popup {
  position: absolute;
  bottom: 100%;
  right: 0;
  width: calc(var(--h) * 2.5);
  height: calc(var(--h) * 0.7);
  background-color: #a778b6;
  border: 1pt solid gray;
  border-radius: 8px;
  padding: calc(var(--h) * 0.08) calc(var(--h) * 0.12);
  display: none;
  align-items: center;
  z-index: 100;
  box-shadow: 0 2px 8px rgba(0,0,0,0.25);
}

.volume-popup.show {
  display: flex;
}

.volume-slider {
  -webkit-appearance: none;
  appearance: none;
  width: 100%;
  height: calc(var(--h) * 0.12);
  border-radius: 999px;
  background: white;
  outline: none;
}

.volume-slider::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: calc(var(--h) * 0.22);
  height: calc(var(--h) * 0.22);
  border-radius: 50%;
  background: white;
  border: 2px solid #7d5a89;
  cursor: pointer;
}

.volume-slider::-moz-range-thumb {
  width: calc(var(--h) * 0.22);
  height: calc(var(--h) * 0.22);
  border-radius: 50%;
  background: white;
  border: 2px solid #7d5a89;
  cursor: pointer;
}

/* Для демонстрации — контейнер */
.demo-wrapper {
  width: 100%;
  height: 100%;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
}
</style>
</head>
<body>
<div class="demo-wrapper">
  <div class="audio-player" id="player">
    <button class="btn btn-play" id="playBtn" aria-label="Воспроизведение / Пауза">
      <svg id="playIcon" viewBox="0 0 24 24"><polygon points="6,4 20,12 6,20"></polygon></svg>
      <svg id="pauseIcon" viewBox="0 0 24 24" style="display:none"><rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect></svg>
    </button>
    <div class="center">
      <div class="top-half">
        <div class="title-wrap" id="titleWrap">
          <div class="title-text" id="titleText">Заголовок аудиозаписи Создай интерактив на чистом языке русском</div>
        </div>
      </div>
      <div class="bottom-half">
        <span class="timer" id="timerElapsed">00:00</span>
        <div class="timeline" id="timeline">
          <div class="timeline-played" id="timelinePlayed"></div>
          <div class="timeline-thumb" id="timelineThumb"></div>
        </div>
        <span class="timer" id="timerTotal">00:00</span>
      </div>
    </div>
    <button class="btn btn-volume" id="volumeBtn" aria-label="Громкость">
      <svg id="volumeIcon" viewBox="0 0 24 24">
        <path d="M3 9v6h4l5 5V4L7 9H3z"></path>
        <path d="M14 8.5c1.2 1 1.2 6 0 7" stroke="white" stroke-width="2" fill="none" stroke-linecap="round"></path>
        <path d="M16.5 6c2.8 2 2.8 10 0 12" stroke="white" stroke-width="2" fill="none" stroke-linecap="round"></path>
      </svg>
      <div class="volume-popup" id="volumePopup">
        <input type="range" class="volume-slider" id="volumeSlider" min="0" max="100" value="100">
      </div>
    </button>
  </div>
</div>

<audio id="audio" src="https://zhuzhzha78.github.io/interactive/audio/mp3/UK1.mp3" preload="metadata" crossorigin="anonymous"></audio>

<script>
(function () {
  'use strict';

  const audio         = document.getElementById('audio');
  const player        = document.getElementById('player');
  const playBtn       = document.getElementById('playBtn');
  const playIcon      = document.getElementById('playIcon');
  const pauseIcon     = document.getElementById('pauseIcon');
  const volumeBtn     = document.getElementById('volumeBtn');
  const volumePopup   = document.getElementById('volumePopup');
  const volumeSlider  = document.getElementById('volumeSlider');
  const volumeIcon    = document.getElementById('volumeIcon');
  const timeline      = document.getElementById('timeline');
  const timelinePlayed= document.getElementById('timelinePlayed');
  const timelineThumb = document.getElementById('timelineThumb');
  const timerElapsed  = document.getElementById('timerElapsed');
  const timerTotal    = document.getElementById('timerTotal');
  const titleText     = document.getElementById('titleText');
  const titleWrap     = document.getElementById('titleWrap');

  const TITLE = titleText.textContent;

  /* --- Установка пропорциональных размеров через CSS-переменную --- */
  function syncHeight() {
    player.style.setProperty('--h', player.offsetHeight + 'px');
    checkMarquee();
  }

  /* --- Форматирование времени mm:ss --- */
  function fmt(sec) {
    if (!isFinite(sec) || isNaN(sec)) return '00:00';
    const m = Math.floor(sec / 60);
    const s = Math.floor(sec % 60);
    return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
  }

  /* --- Проверка: нужна ли бегущая строка --- */
  function checkMarquee() {
    titleText.classList.remove('marquee');
    titleText.textContent = TITLE;
    requestAnimationFrame(function () {
      if (titleText.scrollWidth > titleWrap.clientWidth) {
        titleText.classList.add('marquee');
        titleText.innerHTML = TITLE + '\u00A0\u00A0\u00A0\u00A0\u00A0' + TITLE + '\u00A0\u00A0\u00A0\u00A0\u00A0';
      }
    });
  }

  /* --- Воспроизведение / Пауза --- */
  playBtn.addEventListener('click', function () {
    if (audio.paused) {
      audio.play().catch(function () {});
    } else {
      audio.pause();
    }
  });

  audio.addEventListener('play', function () {
    playIcon.style.display = 'none';
    pauseIcon.style.display = 'block';
  });

  audio.addEventListener('pause', function () {
    playIcon.style.display = 'block';
    pauseIcon.style.display = 'none';
  });

  audio.addEventListener('ended', function () {
    playIcon.style.display = 'block';
    pauseIcon.style.display = 'none';
  });

  /* --- Загрузка метаданных --- */
  audio.addEventListener('loadedmetadata', function () {
    if (audio.duration === Infinity || isNaN(audio.duration)) {
      // обход для некоторых серверов
      audio.currentTime = 1e101;
      audio.addEventListener('timeupdate', function fix() {
        audio.removeEventListener('timeupdate', fix);
        audio.currentTime = 0;
        timerTotal.textContent = fmt(audio.duration);
      });
    } else {
      timerTotal.textContent = fmt(audio.duration);
    }
    checkMarquee();
  });

  /* --- Обновление прогресса --- */
  audio.addEventListener('timeupdate', function () {
    if (!isFinite(audio.duration) || audio.duration === 0) return;
    const p = (audio.currentTime / audio.duration) * 100;
    timelinePlayed.style.width = p + '%';
    timelineThumb.style.left = p + '%';
    timerElapsed.textContent = fmt(audio.currentTime);
  });

  /* --- Перемотка кликом / перетаскиванием --- */
  let dragging = false;

  function seek(clientX) {
    const rect = timeline.getBoundingClientRect();
    const ratio = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
    if (isFinite(audio.duration)) {
      audio.currentTime = ratio * audio.duration;
    }
  }

  timeline.addEventListener('mousedown', function (e) {
    dragging = true;
    seek(e.clientX);
  });

  document.addEventListener('mousemove', function (e) {
    if (dragging) seek(e.clientX);
  });

  document.addEventListener('mouseup', function () { dragging = false; });

  timeline.addEventListener('touchstart', function (e) {
    dragging = true;
    seek(e.touches[0].clientX);
    e.preventDefault();
  }, { passive: false });

  document.addEventListener('touchmove', function (e) {
    if (dragging) seek(e.touches[0].clientX);
  });

  document.addEventListener('touchend', function () { dragging = false; });

  /* --- Громкость --- */
  volumeBtn.addEventListener('click', function (e) {
    if (e.target === volumeSlider || volumeSlider.contains(e.target)) return;
    volumePopup.classList.toggle('show');
    e.stopPropagation();
  });

  document.addEventListener('click', function (e) {
    if (!volumeBtn.contains(e.target)) {
      volumePopup.classList.remove('show');
    }
  });

  function updateVolumeIcon(v) {
    if (v === 0) {
      volumeIcon.innerHTML =
        '<path d="M3 9v6h4l5 5V4L7 9H3z"></path>' +
        '<line x1="15" y1="9" x2="21" y2="15" stroke="white" stroke-width="2" stroke-linecap="round"></line>' +
        '<line x1="21" y1="9" x2="15" y2="15" stroke="white" stroke-width="2" stroke-linecap="round"></line>';
    } else if (v < 0.5) {
      volumeIcon.innerHTML =
        '<path d="M3 9v6h4l5 5V4L7 9H3z"></path>' +
        '<path d="M14 8.5c1.2 1 1.2 6 0 7" stroke="white" stroke-width="2" fill="none" stroke-linecap="round"></path>';
    } else {
      volumeIcon.innerHTML =
        '<path d="M3 9v6h4l5 5V4L7 9H3z"></path>' +
        '<path d="M14 8.5c1.2 1 1.2 6 0 7" stroke="white" stroke-width="2" fill="none" stroke-linecap="round"></path>' +
        '<path d="M16.5 6c2.8 2 2.8 10 0 12" stroke="white" stroke-width="2" fill="none" stroke-linecap="round"></path>';
    }
  }

  volumeSlider.addEventListener('input', function () {
    const v = volumeSlider.value / 100;
    audio.volume = v;
    updateVolumeIcon(v);
  });

  /* --- Инициализация --- */
  window.addEventListener('load', syncHeight);
  window.addEventListener('resize', syncHeight);
  syncHeight();

  // ResizeObserver для надёжного обновления при изменении родителя
  if (window.ResizeObserver) {
    new ResizeObserver(syncHeight).observe(player);
  }
})();
</script>
</body>
</html>
