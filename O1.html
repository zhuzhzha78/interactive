
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  .interactive {
    width: 100%;
    font-family: "bureauserif", serif;
    position: relative;
    background: transparent;
    box-shadow: none;
  }

  .layout {
    display: flex;
    align-items: flex-start;
    gap: 10pt;
  }

  .thumb-wrapper {
    flex: 0 0 100pt;
    cursor: pointer;
  }

  .thumb-img {
    width: 100pt;
    display: block;
    border-radius: 0;
    transition: none;
  }

  .text-block {
    display: flex;
    flex-direction: column;
    flex: 1;
    min-width: 0;
  }

  .label {
    font-size: 14pt;
    color: #000;
    margin-bottom: 4pt;
  }

  .title {
    font-size: 18pt;
    font-weight: bold;
    color: #c94342;
    margin-bottom: 6pt;
  }

  .divider {
    height: 2pt;
    background-color: #c94342;
    margin-bottom: 8pt;
  }

  .expand-row {
    display: flex;
    align-items: center;
  }

  .expand-img {
    width: 50pt;
    margin-right: 10pt;
    display: block;
    cursor: pointer;
  }

  .hint {
    font-size: 12pt;
    color: #000;
  }

  .full-overlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    z-index: 9999;
    cursor: pointer;
    display: none;
  }

  .full-overlay img {
    width: 100%;
    display: block;
  }

  .full-overlay.active {
    display: block;
  }
</style>
</head>
<body style="background:transparent; box-shadow:none;">

<div class="interactive" id="interactive">
  <div class="layout">
    <div class="thumb-wrapper" id="thumbWrapper">
      <img class="thumb-img" id="thumbImg"
           src="https://e.profkiosk.ru/service_tbn2/9jbeo0gg0uqb.png"
           alt="Образец — миниатюра">
    </div>
    <div class="text-block">
      <div class="label">Образец</div>
      <div class="title">Как юристу защитить себя от личных рисков в банкротстве</div>
      <div class="divider"></div>
      <div class="expand-row">
        <img class="expand-img" id="expandImg"
             src="https://e.profkiosk.ru/service_tbn2/gm29so.png"
             alt="Развернуть образец">
        <span class="hint">Нажмите на картинку, чтобы развернуть образец</span>
      </div>
    </div>
  </div>

  <div class="full-overlay" id="fullOverlay">
    <img id="fullImg"
         src="https://e.profkiosk.ru/service_tbn2/9jbeo0gg0uqb.png"
         alt="Образец — полный размер">
  </div>
</div>

<script>
  (function () {
    var thumbImg     = document.getElementById('thumbImg');
    var expandImg    = document.getElementById('expandImg');
    var fullOverlay  = document.getElementById('fullOverlay');
    var fullImg      = document.getElementById('fullImg');

    function showFull() {
      fullOverlay.classList.add('active');
    }

    function hideFull() {
      fullOverlay.classList.remove('active');
    }

    thumbImg.addEventListener('click', showFull);
    expandImg.addEventListener('click', showFull);
    fullOverlay.addEventListener('click', hideFull);
  })();
</script>

</body>
</html>
